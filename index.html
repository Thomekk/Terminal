<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Terminal Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080c;--panel:#0a0e14;--panel-head:#0d1219;
  --line:#1a2029;--line-2:#242c38;
  --text:#c9d1d9;--dim:#6e7681;
  --green:#7ee787;--green-2:#3fb950;
  --amber:#fbbf24;--red:#ff7b72;--blue:#58a6ff;
  --sb:290px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--text);
  font:14px/1.55 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(88,166,255,.08),transparent),
    radial-gradient(ellipse 60% 50% at 50% 120%,rgba(126,231,135,.05),transparent);
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}

/* ---------- HUD ---------- */
.app{display:flex;flex-direction:column;width:100%;max-width:880px;margin:0 auto;padding:0 16px;min-height:100vh;min-height:100dvh}
.hud{
  display:flex;align-items:center;gap:10px;
  padding:12px 4px;border-bottom:1px solid var(--line);
  flex-shrink:0;position:sticky;top:0;z-index:5;
  background:linear-gradient(to bottom,var(--bg) 75%,transparent);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.menu-btn{
  width:34px;height:34px;flex-shrink:0;
  display:grid;place-items:center;border-radius:6px;
  background:var(--panel);border:1px solid var(--line-2);
  color:var(--text);font-size:16px;transition:all .15s;
}
.menu-btn:hover{border-color:var(--green-2);color:var(--green)}
.hud-title{font-size:12px;font-weight:700;letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hud-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.counter{
  font-size:13px;color:var(--dim);white-space:nowrap;
  padding:4px 10px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:6px;
}
.counter b{color:var(--text);font-weight:700}

/* ---------- MAIN ---------- */
.main{flex:1;padding:14px 0;display:flex;flex-direction:column;gap:12px}

/* ---------- PANEL ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.panel-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel-head);border-bottom:1px solid var(--line);min-height:36px}
.panel-dots{display:flex;gap:5px;flex-shrink:0}
.panel-dots i{width:10px;height:10px;border-radius:50%;display:block}
.panel-dots i:nth-child(1){background:#ff5f57}
.panel-dots i:nth-child(2){background:#febc2e}
.panel-dots i:nth-child(3){background:#28c840}
.panel-title{font-size:11px;color:var(--dim);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-tag{
  margin-left:auto;font-size:10px;padding:2px 8px;border-radius:4px;
  background:rgba(88,166,255,.1);color:var(--blue);
  border:1px solid rgba(88,166,255,.25);flex-shrink:0;
  white-space:nowrap;
}
.panel-body{padding:14px 16px}

/* Бейдж «принято» в шапке панели */
.badge{
  font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap;
  background:rgba(126,231,135,.12);color:var(--green);
  border:1px solid rgba(126,231,135,.35);
  opacity:0;transform:translateY(-3px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;margin-left:6px;flex-shrink:0;
}
.badge.show{opacity:1;transform:none;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ---------- INFO ---------- */
.info-title{font-size:15px;color:var(--green);margin-bottom:10px;font-weight:700}
.info-text p{margin-bottom:8px}
.info-text p:last-child{margin-bottom:0}
.info-text code{background:rgba(126,231,135,.1);color:var(--green);padding:1px 6px;border-radius:4px;font-size:13px;border:1px solid rgba(126,231,135,.15)}
.info-text i{color:var(--dim)}
.info-text b{color:var(--amber)}
.info-text ul{padding-left:20px;margin:8px 0}

/* ---------- TASK ---------- */
.task-line{display:flex;gap:10px;align-items:flex-start}
.task-arrow{color:var(--amber);flex-shrink:0}
.task-line b{color:var(--amber)}
.hint-line{
  display:none;margin-top:10px;padding:8px 12px;
  background:rgba(251,191,36,.08);border-left:2px solid var(--amber);
  border-radius:4px;font-size:12px;color:var(--amber);
}
.hint-line.show{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- TERMINAL ---------- */
.term-panel{transition:box-shadow .3s,border-color .3s}
.term-panel.success{border-color:rgba(126,231,135,.4);box-shadow:0 0 24px rgba(126,231,135,.15),0 4px 20px rgba(0,0,0,.3)}
.term-body{
  padding:14px 16px;min-height:150px;max-height:340px;
  overflow-y:auto;font-size:13.5px;line-height:1.7;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;
  scroll-margin-top:80px;scroll-margin-bottom:220px;
}
.term-body::-webkit-scrollbar{width:6px}
.term-body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.term-log{display:flex;flex-direction:column;gap:2px}
.term-row{display:flex;gap:8px;flex-wrap:wrap;word-break:break-all}
.term-row .cmd{color:var(--text)}
.prompt{color:var(--green);font-weight:500;white-space:nowrap}
.prompt-path{color:var(--blue)}
.prompt-sign{color:var(--text);margin-left:2px}
.term-out{color:var(--dim);white-space:pre-wrap;word-break:break-word}
.term-err{margin-top:6px;padding:6px 10px;border-radius:4px;animation:slideIn .3s ease;font-size:13px;color:var(--red);background:rgba(255,123,114,.08);border-left:2px solid var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

.term-input-line{display:flex;gap:8px;align-items:center;margin-top:4px}
.term-input-line input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font:inherit;padding:0;
  caret-color:var(--green);min-width:0;
}
.term-input-line input:disabled{color:var(--dim);caret-color:transparent}

/* ---------- CODE EDITOR ---------- */
.code-body{padding:0}
.code-body textarea{
  width:100%;min-height:150px;max-height:340px;
  background:transparent;border:none;outline:none;resize:vertical;
  color:var(--text);font:13.5px/1.7 'JetBrains Mono',monospace;
  padding:14px 16px;caret-color:var(--green);
  scroll-margin-top:80px;scroll-margin-bottom:220px;
}
.code-body textarea:disabled{color:var(--dim)}
.code-actions{display:flex;gap:8px;padding:0 16px 14px;align-items:center}
.code-out{
  padding:0 16px 14px;color:var(--dim);
  white-space:pre-wrap;word-break:break-word;font-size:13px;
}
.code-out:empty{display:none}
.code-out::before{
  content:'▸ вывод:';display:block;color:var(--blue);
  font-size:11px;margin-bottom:4px;letter-spacing:.05em;
}

/* ---------- QUIZ ---------- */
.quiz-question{font-size:14px;color:var(--text);margin-bottom:12px;font-weight:500;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-option{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.02);
  border:1px solid var(--line-2);border-radius:6px;
  color:var(--text);font:inherit;font-size:13px;
  text-align:left;width:100%;transition:all .15s;
}
.quiz-option:hover:not(:disabled){border-color:var(--blue);background:rgba(88,166,255,.06)}
.quiz-option:disabled{cursor:default;opacity:.55}
.quiz-option .key{flex-shrink:0;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;background:var(--line-2);font-size:11px;color:var(--dim);transition:.2s}
.quiz-option .label{flex:1;line-height:1.4}
.quiz-option.correct{border-color:var(--green-2);background:rgba(126,231,135,.08);opacity:1}
.quiz-option.correct .key{background:var(--green-2);color:#000}
.quiz-option.wrong{border-color:var(--red);background:rgba(255,123,114,.06);opacity:1}
.quiz-option.wrong .key{background:var(--red);color:#000}

/* ---------- SUCCESS BLOCK ---------- */
.success-block{
  display:none;background:var(--panel);
  border:1px solid rgba(126,231,135,.4);border-radius:8px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.3),0 0 24px rgba(126,231,135,.15);
}
.success-block.show{display:block;animation:slideDown .35s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.success-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel-head);border-bottom:1px solid rgba(126,231,135,.2)}
.success-head .panel-title{color:var(--green)}
.success-body{padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.success-icon{font-size:36px;line-height:1;flex-shrink:0;animation:pop .5s ease-out}
.success-text{flex:1;min-width:180px}
.success-text h2{color:var(--green);font-size:15px;margin-bottom:4px;font-weight:700}
.success-text p{color:var(--dim);font-size:13px;line-height:1.5}
.success-actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}

/* ---------- FOOTER ---------- */
.footer{
  flex-shrink:0;padding:10px 0 16px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;background:var(--bg);
  position:sticky;bottom:0;z-index:4;
}
.status{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;
  font-size:12px;min-height:36px;transition:all .2s;
}
.status.ok{border-color:rgba(126,231,135,.3);background:rgba(126,231,135,.05)}
.status.err{border-color:rgba(255,123,114,.3);background:rgba(255,123,114,.05)}
.status-icon{color:var(--dim);font-weight:700}
.status-text{color:var(--dim)}
.status.ok .status-icon,.status.ok .status-text{color:var(--green)}
.status.err .status-icon,.status.err .status-text{color:var(--red)}

.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn{
  padding:9px 16px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:6px;
  color:var(--text);font:inherit;font-size:13px;transition:all .15s;
}
.btn:hover:not(:disabled){border-color:var(--green-2);color:var(--green)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:rgba(126,231,135,.1);border-color:var(--green-2);color:var(--green)}
.btn-primary:hover:not(:disabled){background:rgba(126,231,135,.18);box-shadow:0 0 16px rgba(126,231,135,.25)}
.btn-primary:not(:disabled){animation:pulseGlow 2s infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 12px rgba(126,231,135,.2)}50%{box-shadow:0 0 20px rgba(126,231,135,.4)}}

/* ---------- OVERLAY ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,8,12,.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;z-index:50;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto}
.overlay-card{
  background:var(--panel);border:1px solid var(--line-2);
  border-radius:12px;padding:32px 40px;text-align:center;
  transform:translateY(10px);transition:transform .3s;
  max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.overlay.show .overlay-card{transform:none}
.overlay-icon{font-size:48px;margin-bottom:12px;line-height:1}
.overlay-card h2{color:var(--green);margin-bottom:8px;font-size:20px}
.overlay-card p{color:var(--dim);margin-bottom:20px;font-size:13px;line-height:1.6}

/* ---------- SIDEBAR ---------- */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sb);max-width:88vw;
  background:var(--panel);border-right:1px solid var(--line-2);
  z-index:60;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .25s ease;
  box-shadow:8px 0 40px rgba(0,0,0,.5);
}
.sidebar.open{transform:translateX(0)}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sb-head b{font-size:12px;letter-spacing:.14em;color:var(--green);flex:1}
.sb-close{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--dim);font-size:16px}
.sb-close:hover{color:var(--red)}
.sb-list{flex:1;overflow-y:auto;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.sb-list::-webkit-scrollbar{width:5px}
.sb-list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}

.sb-course{padding:2px 0;border-bottom:1px solid transparent}
.sb-course-title{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  width:100%;text-align:left;transition:background .15s;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;
}
.sb-course-title:hover{background:rgba(255,255,255,.02);color:var(--text)}
.sb-course-title .chev{
  width:12px;flex-shrink:0;color:var(--dim);
  transition:transform .2s;font-size:10px;
}
.sb-course.open .sb-course-title .chev{transform:rotate(90deg)}
.sb-course-title .ic{
  width:22px;height:22px;border-radius:4px;
  display:grid;place-items:center;font-size:10px;
  background:rgba(88,166,255,.1);color:var(--blue);
  border:1px solid rgba(88,166,255,.2);font-weight:700;
  flex-shrink:0;
}
.sb-course.active .sb-course-title .ic{background:rgba(126,231,135,.15);color:var(--green);border-color:rgba(126,231,135,.3)}
.sb-course-title .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-course.active .sb-course-title .ttl{color:var(--text)}
.sb-course-title .cnt{
  font-size:10px;color:var(--dim);padding:1px 6px;border-radius:8px;
  background:rgba(255,255,255,.04);flex-shrink:0;
}
.sb-course.open .sb-course-title .cnt{color:var(--green)}

.sb-course-lessons{display:none;padding:4px 0 6px}
.sb-course.open .sb-course-lessons{display:block;animation:fadeIn .2s ease}

.sb-lesson{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px 7px 30px;font-size:12.5px;color:var(--dim);
  cursor:pointer;transition:all .12s;width:100%;text-align:left;
  border-left:2px solid transparent;
}
.sb-lesson:hover{color:var(--text);background:rgba(255,255,255,.02)}
.sb-lesson.active{color:var(--green);border-left-color:var(--green);background:rgba(126,231,135,.05)}
.sb-lesson.done::before{content:'✓';color:var(--green-2);font-size:11px;width:12px;flex-shrink:0}
.sb-lesson:not(.done)::before{content:'○';color:var(--line-2);font-size:11px;width:12px;flex-shrink:0}
.sb-lesson .num{color:var(--dim);font-size:10px;flex-shrink:0}
.sb-lesson .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* ---------- SIDEBAR FOOTER: ссылки, почта, очистка ---------- */
.sb-foot{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--panel-head)}
.sb-links{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.sb-link{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:6px;color:var(--text);
  text-decoration:none;transition:background .15s;
  border:1px solid transparent;
}
.sb-link:hover{background:rgba(88,166,255,.06);border-color:rgba(88,166,255,.15)}
.sb-link .ic{
  width:26px;height:26px;border-radius:6px;flex-shrink:0;
  display:grid;place-items:center;font-size:12px;
  background:rgba(88,166,255,.1);color:var(--blue);
  border:1px solid rgba(88,166,255,.2);
}
.sb-link .tx{display:flex;flex-direction:column;min-width:0}
.sb-link .tx b{font-size:12px;font-weight:600;color:var(--text)}
.sb-link .tx i{font-style:normal;font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sb-danger{
  width:100%;padding:9px;margin-top:4px;
  background:rgba(255,123,114,.06);
  border:1px solid rgba(255,123,114,.25);
  color:var(--red);border-radius:6px;
  font-size:11.5px;letter-spacing:.03em;
  transition:all .15s;text-align:center;
}
.sb-danger:hover{background:rgba(255,123,114,.14);border-color:rgba(255,123,114,.5)}
.sb-danger.armed{
  background:rgba(255,123,114,.2);border-color:var(--red);
  animation:armPulse .8s infinite;color:#fff;
}
@keyframes armPulse{0%,100%{opacity:1}50%{opacity:.6}}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}

/* ---------- АДАПТИВ ---------- */
@media (max-width:600px){
  .hud{padding:10px 2px}
  .hud-title{font-size:11px}
  .counter{font-size:12px;padding:3px 8px}
  .panel-body{padding:12px 14px}
  .term-body,.code-body textarea{padding:12px 14px;font-size:13px;max-height:280px}
  .info-title{font-size:14px}
  .btn{padding:8px 12px;font-size:12px}
  .overlay-card{padding:24px 20px}
  .success-icon{font-size:30px}
  .success-body{padding:12px 14px;gap:10px}
  .success-actions{width:100%}
  .success-actions .btn{flex:1}
}
@media (max-width:380px){
  .nav .btn{flex:1 1 auto;min-width:0;padding:8px 8px;font-size:11px}
}
</style>
</head>
<body>

<div class="app">

  <header class="hud">
    <button class="menu-btn" id="menuBtn" aria-label="Меню">≡</button>
    <span class="hud-title" id="hudTitle">КВЕСТ</span>
    <div class="hud-right">
      <div class="counter"><b id="counterCur">1</b>/<span id="counterTotal">8</span></div>
    </div>
  </header>

  <main class="main">

    <section class="panel">
      <div class="panel-head">
        <span class="panel-dots"><i></i><i></i><i></i></span>
        <span class="panel-title" id="infoTitle">Информация</span>
      </div>
      <div class="panel-body" id="infoBody"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-dots"><i></i><i></i><i></i></span>
        <span class="panel-title" id="taskTitle">Задание</span>
      </div>
      <div class="panel-body">
        <div class="task-line">
          <span class="task-arrow">▸</span>
          <span id="taskText"></span>
        </div>
        <div class="hint-line" id="hintLine"></div>
      </div>
    </section>

    <!-- Терминал -->
    <section class="panel term-panel" id="termPanel">
      <div class="panel-head">
        <span class="panel-dots"><i></i><i></i><i></i></span>
        <span class="panel-title" id="termTitle">Терминал</span>
        <span class="badge" id="termBadge"></span>
        <span class="panel-tag" id="cmdTag">ls</span>
      </div>
      <div class="panel-body term-body" id="termBody">
        <div class="term-log" id="termLog"></div>
        <div class="term-input-line">
          <span class="prompt">user@quest<span class="prompt-path">:~/quest</span><span class="prompt-sign">$</span></span>
          <input id="termInput" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
        </div>
      </div>
    </section>

    <!-- Редактор кода -->
    <section class="panel" id="codePanel" style="display:none">
      <div class="panel-head">
        <span class="panel-dots"><i></i><i></i><i></i></span>
        <span class="panel-title" id="codeTitle">Код</span>
        <span class="badge" id="codeBadge"></span>
        <span class="panel-tag" id="langTag">js</span>
      </div>
      <div class="panel-body code-body">
        <textarea id="codeArea" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea>
        <div class="code-actions">
          <button class="btn btn-primary" id="runBtn">▶ Запустить</button>
        </div>
        <div class="code-out" id="codeOut"></div>
      </div>
    </section>

    <!-- Викторина -->
    <section class="panel" id="quizPanel" style="display:none">
      <div class="panel-head">

<script>
/* ================================================================
   APP — конфигурация приложения и все курсы.

   КАЖДЫЙ УРОК ПОЛУЧАЕТ УНИКАЛЬНЫЙ ID:
     • если поле id задано вручную — используется оно;
     • иначе — автоматически из course.id + слаг(название).
   Прогресс в localStorage хранится ПО ID, а не по индексу, поэтому
   можно свободно вставлять новые уроки в середину массива.

   СТРУКТУРА КУРСА:
   {
     id:    'terminal',
     title: 'Терминал',
     icon:  '>_',
     labels:{ ... },                        // опционально
     lessons: [ { id:'ls-1', type:'terminal', ... }, ... ]
   }

   ТИПЫ УРОКОВ:
     'terminal' — ввод команды в терминал.
     'code'     — редактор кода + запуск (js исполняется реально).
     'quiz'     — выбор ответа.

   ОБЩИЕ ПОЛЯ УРОКА:
     id, title, info, task, hint,
     labels: { info, task, term, quiz, code, success, badge }
     success: {icon,title,message,continueText,retryText}

   'terminal': expect:{exact|regex|oneOf|startsWith}, output
   'code':     lang:'js'|'py', starter:'...', expect:{...},
               run:true|false, output:'...'
   'quiz':     question, options, correct
   ================================================================ */
const APP = {
  title: 'КВЕСТ',
  storageKey: 'quest-v3',
  defaultLabels: {
    info:'Информация', task:'Задание', term:'Терминал',
    quiz:'Викторина', code:'Код', success:'Результат',
    badge:'✓ Принято'
  },
  courses: [

    /* ============ КУРС 1: ТЕРМИНАЛ ============ */
    {
      id: 'terminal',
      title: 'Терминал',
      icon: '>_',
lessons: [

  /* ═══════ ls — от простого к сложному ═════ */
  {
    id: 'term-ls-1', type: 'terminal', title: 'ls — что в папке?', cmd: 'ls',
    info: `<p><code>ls</code> (от <i>list</i>) — выводит список файлов и папок в текущем каталоге.</p>
           <p>Без аргументов показывает всё, кроме скрытых файлов.</p>`,

    hint: 'Команда из двух букв: l и s.',

    output: ['Documents/  Downloads/  Pictures/', 'readme.txt  notes.txt  script.sh'],
    success: { icon:'📂', title:'Готово!', message:'ls показал обычные файлы и папки.', continueText:'К ls -a →' }
  },
  {
    id: 'term-ls-a', type: 'terminal', title: 'ls -a — показать скрытое', cmd: 'ls -a',
    info: `<p>Флаг <code>-a</code> (all) показывает <b>все</b> файлы, включая скрытые.</p>
           <p>Скрытые файлы начинаются с точки: <code>.bashrc</code>, <code>.gitignore</code>.</p>
           <p>Также показываются <code>.</code> (текущая) и <code>..</code> (родительская) папки.</p>`,
    task: 'Покажите все файлы, включая скрытые.',
    hint: 'ls -a — пробел и дефис обязательны.',
    expect: { exact: 'ls -a' },
    output: '.  ..  .bashrc  .gitignore  Documents/  readme.txt',
    success: { icon:'👁️', title:'Скрытое видно!', message:'Точка в начале имени делает файл скрытым.', continueText:'К ls -A →' }
  },
  {
    id: 'term-ls-A', type: 'terminal', title: 'ls -A — всё, кроме . и ..', cmd: 'ls -A',

           <p>Часто удобнее: меньше лишнего в списке.</p>`,
    task: 'Покажите все файлы, но без точек . и ..',
    hint: 'Заглавная A, не путай с маленькой.',
    expect: { exact: 'ls -A' },
    output: '.bashrc  .gitignore  Documents/  readme.txt',
    success: { icon:'🧹', title:'Чисто!', message:'-A удобно, когда не нужны «.» и «..».', continueText:'К ls -l →' }
  },
  {
    id: 'term-ls-l', type: 'terminal', title: 'ls -l — подробный список', cmd: 'ls -l',
    info: `<p>Флаг <code>-l</code> (long) показывает <b>подробный</b> список:</p>
           <ul>
             <li>права доступа (<code>drwxr-xr-x</code>)</li>
             <li>владелец и группа</li>
             <li>размер в байтах</li>
             <li>дата и время</li>
             <li>имя файла</li>
           </ul>`,
    task: 'Покажите подробный список файлов.',
    hint: 'Буква l (эл), не путай с цифрой 1.',
    expect: { exact: 'ls -l' },
    output: [
      '-rw-r--r-- 1 user user  220 Jan 15 10:24 readme.txt',
      'drwxr-xr-x 2 user user 4096 Jan 14 09:10 Documents/'
    ],
    success: { icon:'📋', title:'Длинный формат', message:'Так выглядит классический вывод ls -l.', continueText:'К ls -la →' }
  },
  {
    id: 'term-ls-la', type: 'terminal', title: 'ls -la — флаги вместе', cmd: 'ls -la',
    info: `<p>Флаги можно <b>объединять</b>: <code>ls -la</code> = <code>ls -l -a</code>.</p>
           <p>Один дефис и подряд идущие буквы — обычная практика в UNIX.</p>`,
    task: 'Покажите подробный список, включая скрытые файлы.',
    hint: 'ls -la или ls -al — оба работают.',
    expect: { oneOf: ['ls -la', 'ls -al'] },
    output: [
      'drwxr-xr-x 5 user user 4096 Jan 15 10:24 .',
      'drwxr-xr-x 3 user user 4096 Jan 10 08:00 ..',
      '-rw-r--r-- 1 user user  220 Jan 15 10:24 .bashrc',
      '-rw-r--r-- 1 user user  220 Jan 15 10:24 readme.txt'
    ],
    success: { icon:'🔗', title:'Объединено!', message:'Флаги объединяются через одну строку.', continueText:'К ls -lh →' }
  },
  {
    id: 'term-ls-lh', type: 'terminal', title: 'ls -lh — размер по-человечески', cmd: 'ls -lh',
    info: `<p>Флаг <code>-h</code> (human) делает размеры <b>читаемыми</b>: <code>1K</code>, <code>2M</code>, <code>1G</code> вместо байтов.</p>
           <p>Работает только вместе с <code>-l</code>.</p>`,
    task: 'Покажите подробный список с размерами в K/M/G.',
    hint: 'ls -lh — маленькая буква h.',
    expect: { oneOf: ['ls -lh', 'ls -hl'] },
    output: [
      '-rw-r--r-- 1 user user  220B Jan 15 10:24 readme.txt',
      '-rw-r--r-- 1 user user  1.2M Jan 14 18:02 video.mp4',
      'drwxr-xr-x 2 user user  4.0K Jan 14 09:10 Documents/'
    ],
    success: { icon:'📏', title:'Читаемые размеры', message:'h = human, для людей.', continueText:'К ls -R →' }
  },
  {
    id: 'term-ls-R', type: 'terminal', title: 'ls -R — рекурсивно', cmd: 'ls -R',
    info: `<p>Флаг <code>-R</code> (recursive) показывает содержимое <b>всех</b> вложенных папок.</p>
           <p>Удобно, когда нужно увидеть дерево целиком. На больших папках может быть очень длинным.</p>`,
    task: 'Покажите содержимое папки и всех вложенных папок.',
    hint: 'Заглавная R.',
    expect: { exact: 'ls -R' },
    output: [
      '.:',
      'Documents/  readme.txt',
      '',
      './Documents:',
      'report.pdf  notes.txt'
    ],
    success: { icon:'🌳', title:'Рекурсия!', message:'ls -R обходит все вложенные папки.', continueText:'К ls -t →' }
  },
  {
    id: 'term-ls-t', type: 'terminal', title: 'ls -t — по времени', cmd: 'ls -t',
    info: `<p>Флаг <code>-t</code> (time) сортирует файлы по <b>времени изменения</b> — сначала свежие.</p>

    task: 'Покажите файлы, отсортированные по времени изменения.',
    hint: 'ls -t или ls -lt.',
    expect: { oneOf: ['ls -t', 'ls -lt', 'ls -tl'] },
    output: [
      'notes.txt         (сейчас)',
      'readme.txt        (вчера)',
      'Documents/        (неделю назад)'
    ],
    success: { icon:'⏱️', title:'Свежие сверху!', message:'-t полезен, когда ищешь недавно изменённый файл.', continueText:'К викторине →' }
  },
  {
    id: 'term-ls-quiz', type: 'quiz', title: 'Проверка: флаги ls',
    info: `<p>Небольшая проверка по флагам <code>ls</code>.</p>`,
    task: 'Выбери правильный вариант.',
    question: 'Что делает <b>ls -a</b>?',
    options: [
      'Показывает только папки',
      'Показывает все файлы, включая скрытые',
      'Сортирует по имени',
      'Удаляет файлы'
    ],
    correct: 1,
    hint: '-a = all (всё).',
    success: { icon:'🧠', title:'Верно!', message:'-a = all, показывает скрытые файлы.', continueText:'Дальше →' }
  },

  /* ═══════════════ pwd ═══════════════ */

  {
    id: 'term-pwd', type: 'terminal', title: 'pwd — где я нахожусь?', cmd: 'pwd',
    info: `<p>Команда <code>pwd</code> (print working directory) показывает <b>полный путь</b> к текущей папке.</p>
           <p>Полезно, когда «потерялся» в файловой системе.</p>`,
    task: 'Узнайте полный путь к текущей папке.',
    hint: 'Три буквы: pwd.',
    expect: { exact: 'pwd' },
    output: '/home/user/quest',
    success: { icon:'📍', title:'Путь найден', message:'Ты в /home/user/quest.', continueText:'К cd →' }
  },

  /* ═══════════════ cd ═══════════════ */

  {
    id: 'term-cd-1', type: 'terminal', title: 'cd — переход в папку', cmd: 'cd',
    info: `<p><code>cd</code> (change directory) — переход в другую папку.</p>
           <p>Синтаксис: <code>cd имя_папки</code>. Если команда сработала — она ничего не выводит.</p>`,
    task: 'Перейдите в папку <b>Documents</b>.',
    hint: 'cd Documents — пробел и имя папки.',
    expect: { regex: /^cd\s+Documents$/i },
    output: 'user@quest:~/quest/Documents$',
    success: { icon:'🚪', title:'Ты внутри Documents', message:'cd молчит при успехе — это норма.', continueText:'К cd .. →' }
  },
  {
    id: 'term-cd-dotdot', type: 'terminal', title: 'cd .. — на уровень выше', cmd: 'cd ..',
    info: `<p><code>..</code> — это «родительская папка» (на уровень выше).</p>
           <p>Так же <code>.</code> — это текущая папка.</p>
           <p><b>Важно:</b> между <code>cd</code> и <code>..</code> нужен пробел.</p>`,
    task: 'Поднимитесь на уровень выше.',
    hint: 'cd .. — пробел и две точки.',
    expect: { regex: /^cd\s+\.\.$/ },
    output: 'user@quest:~/quest$',
    success: { icon:'⬆️', title:'Выше!', message:'.. всегда ведёт к родительской папке.', continueText:'К cd ~ →' }
  },
  {
    id: 'term-cd-tilde', type: 'terminal', title: 'cd ~ — в домашнюю папку', cmd: 'cd ~',
    info: `<p><code>~</code> (тильда) — это <b>домашняя папка</b> пользователя.</p>
           <p><code>cd ~</code> и просто <code>cd</code> без аргументов работают одинаково — возвращают домой.</p>`,
    task: 'Перейдите в домашнюю папку через тильду.',
    hint: 'cd ~ — тильда находится над Tab (в ENG раскладке).',
    expect: { regex: /^cd\s+~$/ },
    output: 'user@home:~$',
    success: { icon:'🏠', title:'Дома!', message:'~ = твоя домашняя папка.', continueText:'К cd - →' }
  },
  {
    id: 'term-cd-dash', type: 'terminal', title: 'cd - — назад', cmd: 'cd -',
    info: `<p><code>cd -</code> возвращает в <b>предыдущую</b> папку — как кнопка «назад» в браузере.</p>

    task: 'Вернитесь в предыдущую папку.',
    hint: 'cd - — дефис, не подчёркивание.',
    expect: { regex: /^cd\s+-$/ },
    output: '/home/user/quest',
    success: { icon:'↩️', title:'Назад!', message:'cd - всегда туда, где был до этого.', continueText:'К викторине →' }
  },
  {
    id: 'term-cd-quiz', type: 'quiz', title: 'Проверка: cd',
    info: `<p>Проверим переходы.</p>`,
    task: 'Выбери правильный вариант.',
    question: 'Куда ведёт <b>cd ..</b>?',
    options: ['В домашнюю папку','На уровень выше','В корень системы','Никуда, это ошибка'],
    correct: 1,
    hint: '.. — родительская папка.',
    success: { icon:'🎯', title:'Верно!', continueText:'Дальше →' }
  },

  /* ═══════════════ mkdir ═══════════════ */

  {
    id: 'term-mkdir-1', type: 'terminal', title: 'mkdir — создать папку', cmd: 'mkdir',
    info: `<p><code>mkdir</code> (make directory) — создаёт новую папку.</p>

    task: 'Создайте папку <b>projects</b>.',
    hint: 'mkdir projects',
    expect: { regex: /^mkdir\s+projects$/i },
    output: '✓ Папка projects создана',
    success: { icon:'📁', title:'Готово!', message:'Папка появилась.', continueText:'К mkdir -p →' }
  },
  {
    id: 'term-mkdir-p', type: 'terminal', title: 'mkdir -p — вложенные папки', cmd: 'mkdir -p',
    info: `<p>Флаг <code>-p</code> (parents) создаёт <b>цепочку</b> папок за один раз.</p>

    expect: { regex: /^mkdir\s+-p\s+a\/b\/c$/i },

    success: { icon:'🌲', title:'Цепочка!', message:'-p создаёт все промежуточные папки.', continueText:'К touch →' }
  },

  /* ═══════════════ touch ═══════════════ */

  {
    id: 'term-touch-1', type: 'terminal', title: 'touch — создать файл', cmd: 'touch',

  {

    success: { icon:'📚', title:'Три сразу!', message:'Аргументы разделяются пробелами.', continueText:'К echo →' }

  /* ═══════════════ echo ═══════════════ */

  {
    id: 'term-echo-1', type: 'terminal', title: 'echo — вывод текста', cmd: 'echo',

  {
    id: 'term-echo-quote', type: 'terminal', title: 'echo "..." — с пробелами', cmd: 'echo',

let quizLocked = false;
let openCourseId = null;         // какой курс раскрыт в сайдбаре

const curCourse  = () => APP.courses.find(c => c.id === state.courseId) || APP.courses[0];
const curLesson  = () => curCourse().lessons[state.lessonIdx] || curCourse().lessons[0];
const curProgress = () => (state.progress[state.courseId] ||= { completed:[], current:null });

/* Проверка и нормализация сохранённого прогресса */
function normalizeProgress(p){
  const out = {};
  if (!p || typeof p !== 'object') return out;
  Object.keys(p).forEach(cid => {
    const v = p[cid];
    if (!v || typeof v !== 'object') return;
    out[cid] = {
      completed: Array.isArray(v.completed) ? v.completed.filter(x => typeof x === 'string') : [],
      current: typeof v.current === 'string' ? v.current : null
    };
  });
  return out;
}

/* ================== LOCALSTORAGE ================== */
function saveProgress(){
  try{
    localStorage.setItem(APP.storageKey, JSON.stringify({
      courseId: state.courseId,
      progress: state.progress
    }));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(APP.storageKey);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearProgress(){ try{ localStorage.removeItem(APP.storageKey); }catch(e){} }

/* ================== УТИЛИТЫ ДЛЯ УРОКА ================== */
function lessonDone(lesson){
  return curProgress().completed.includes(lid(state.courseId, lesson));
}
function markDone(lesson){
  const id = lid(state.courseId, lesson);
  const cp = curProgress();
  if (!cp.completed.includes(id)) cp.completed.push(id);
}
function courseDoneCount(courseId){
  const c = APP.courses.find(x => x.id === courseId);
  if (!c) return 0;
  const p = state.progress[courseId] || { completed:[] };
  return c.lessons.filter(l => p.completed.includes(lid(courseId, l))).length;
}

/* ================== SIDEBAR ================== */
function renderSidebar(){
  els.sbList.innerHTML = '';

  APP.courses.forEach(course => {
    const isOpen = openCourseId === course.id;
    const isActive = course.id === state.courseId;

    const wrap = document.createElement('div');
    wrap.className = 'sb-course'
      + (isActive ? ' active' : '')
      + (isOpen ? ' open' : '');

    // Заголовок курса — клик раскрывает/закрывает список уроков
    const titleEl = document.createElement('button');
    titleEl.type = 'button';
    titleEl.className = 'sb-course-title';
    titleEl.innerHTML =
      '<span class="chev">▸</span>' +
      '<span class="ic">' + escapeHtml(course.icon || '•') + '</span>' +
      '<span class="ttl">' + escapeHtml(course.title) + '</span>' +
      '<span class="cnt">' + courseDoneCount(course.id) + '/' + course.lessons.length + '</span>';
    titleEl.addEventListener('click', () => {
      // Только один открыт одновременно
      openCourseId = isOpen ? null : course.id;
      renderSidebar();
    });
    wrap.appendChild(titleEl);

    // Уроки — рендерим только когда курс раскрыт
    if (isOpen){
      const lessonsWrap = document.createElement('div');
      lessonsWrap.className = 'sb-course-lessons';

      course.lessons.forEach((lesson, i) => {
        const id = lid(course.id, lesson);
        const cp = state.progress[course.id] || { completed:[], current:null };

        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sb-lesson';
        if (id === cp.current && isActive) b.classList.add('active');
        if (cp.completed.includes(id)) b.classList.add('done');
        b.innerHTML =
          '<span class="num">' + (i+1) + '.</span>' +
          '<span class="txt">' + escapeHtml(lesson.title) + '</span>';

        b.addEventListener('click', () => {
          // При смене курса — рендерим заново
          state.courseId = course.id;
          openCourseId = course.id;
          loadLesson(i);
          closeSidebar();
        });
        lessonsWrap.appendChild(b);
      });
      wrap.appendChild(lessonsWrap);
    }

    els.sbList.appendChild(wrap);
  });
}

function openSidebar(){
  if (!openCourseId) openCourseId = state.courseId; // авто-раскрыть текущий курс
  renderSidebar();
  els.sidebar.classList.add('open');
  els.backdrop.classList.add('show');
}
function closeSidebar(){
  els.sidebar.classList.remove('open');
  els.backdrop.classList.remove('show');
}

/* ================== HUD ================== */
function updateHud(){
  els.counterCur.textContent = state.lessonIdx + 1;
  els.counterTotal.textContent = curCourse().lessons.length;
}

/* ================== РЕНДЕР ================== */
function renderOutput(output, target){
  if (!output) return;
  const text = Array.isArray(output) ? output.join('\n') : String(output);
  const d = document.createElement('div');
  d.className = 'term-out';
  d.textContent = text;
  (target || els.termLog).appendChild(d);
}

function renderQuiz(lesson){
  els.quizQuestion.innerHTML = lesson.question || 'Выберите правильный ответ:';
  els.quizOptions.innerHTML = '';
  quizLocked = false;
  (lesson.options || []).forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.type = 'button';
    btn.innerHTML = '<span class="key">' + String.fromCharCode(65+i) + '</span>' +
                    '<span class="label">' + escapeHtml(opt) + '</span>';
    btn.addEventListener('click', () => selectQuizOption(i));
    els.quizOptions.appendChild(btn);
  });
}

function clearBadges(){
  [els.termBadge, els.codeBadge, els.quizBadge].forEach(b => {
    b.classList.remove('show');
    b.textContent = '';
  });
}

function showBadge(panel){
  const lesson = curLesson();
  const L = labels(lesson);
  const badge = panel === 'code' ? els.codeBadge : panel === 'quiz' ? els.quizBadge : els.termBadge;
  badge.textContent = L.badge || '✓ Принято';
  badge.classList.add('show');
}

/* Полный сброс отображения перед рендером нового урока */
function resetLessonView(){
  els.hintLine.textContent = '';
  els.hintLine.classList.remove('show');
  clearBadges();
  hideSuccess();

  // Терминал
  els.termLog.innerHTML = '';
  els.termInput.value = '';
  els.termInput.disabled = false;
  els.termPanel.classList.remove('success');

  // Код
  els.codeArea.value = '';
  els.codeArea.disabled = false;
  els.codeOut.textContent = '';

  // Викторина
  els.quizOptions.innerHTML = '';
  els.quizQuestion.innerHTML = '';

  // Навигация
  els.nextBtn.disabled = true;
}

function labels(lesson){
  return Object.assign({}, APP.defaultLabels, curCourse().labels || {}, lesson.labels || {});
}

function loadLesson(idx){
  // Защита от некорректного индекса
  const lessons = curCourse().lessons;
  if (!lessons.length) return;
  idx = Math.max(0, Math.min(idx, lessons.length - 1));
  state.lessonIdx = idx;

  const lesson = lessons[idx];
  const L = labels(lesson);

  // Сохраняем текущий урок по ID
  const cp = curProgress();
  cp.current = lid(state.courseId, lesson);

  resetLessonView();

  // Заголовки блоков
  els.hudTitle.textContent = APP.title + ' · ' + curCourse().title;
  els.infoTitle.textContent = L.info;
  els.taskTitle.textContent = L.task;
  els.termTitle.textContent = L.term;
  els.codeTitle.textContent = L.code;
  els.quizTitle.textContent = L.quiz;
  els.successTitle.textContent = L.success;

  // Инфо
  els.infoBody.innerHTML =
    '<h2 class="info-title">' + escapeHtml(lesson.title) + '</h2>' +
    '<div class="info-text">' + lesson.info + '</div>';

  // Задание
  els.taskText.innerHTML = lesson.task;

  // Показ нужной панели
  const type = lesson.type || 'terminal';
  els.termPanel.style.display = type === 'terminal' ? '' : 'none';
  els.codePanel.style.display = type === 'code' ? '' : 'none';
  els.quizPanel.style.display = type === 'quiz' ? '' : 'none';

  if (type === 'terminal'){
    els.cmdTag.textContent = lesson.cmd || '';
    els.cmdTag.style.display = '';
  } else if (type === 'code'){
    els.langTag.textContent = lesson.lang || 'txt';
    els.codeArea.value = lesson.starter || '';
    els.codeArea.disabled = false;
  } else if (type === 'quiz'){
    renderQuiz(lesson);
  }

  // HUD
  updateHud();

  // Навигация
  els.prevBtn.disabled = idx === 0;
  const isLast = idx === lessons.length - 1;
  els.nextBtn.textContent = isLast ? 'Завершить ✓' : 'Далее →';

  // Статус
  setStatus('', type === 'quiz' ? 'Выберите правильный вариант'
    : type === 'code' ? 'Напишите код и нажмите «Запустить»'
    : 'Введи команду и нажми Enter');

  // Если урок уже пройден — показываем бейдж и включаем «Далее»
  if (lessonDone(lesson)){
    showBadge(type === 'code' ? 'code' : type === 'quiz' ? 'quiz' : 'terminal');
    if (type === 'terminal') els.termInput.disabled = true;
    els.nextBtn.disabled = false;
  }

  // Фокус и автоскролл
  if (type === 'terminal'){
    setTimeout(() => {
      els.termInput.focus({ preventScroll:true });
      scrollFieldIntoView(els.termInput);
    }, 80);
  } else if (type === 'code'){
    setTimeout(() => {
      els.codeArea.focus({ preventScroll:true });
      scrollFieldIntoView(els.codeArea);
    }, 80);
  }

  saveProgress();
  renderSidebar();
}

/* Автоскролл к активному полю — чтобы мобильная клавиатура не закрывала его */
function scrollFieldIntoView(el){
  if (!el) return;
  const r = el.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight;
  if (r.bottom > vh * 0.6){
    const targetY = window.scrollY + r.top - vh * 0.35;
    window.scrollTo({ top: Math.max(0, targetY), behavior:'smooth' });
  }
}

/* ================== ПРОВЕРКА ОТВЕТА ================== */
function checkAnswer(lesson, val){
  const e = lesson.expect || {};
  if (e.exact !== undefined) return val === e.exact;
  if (e.startsWith !== undefined) return val.startsWith(e.startsWith);
  if (e.oneOf !== undefined) return e.oneOf.includes(val);
  if (e.regex !== undefined) return e.regex.test(val);
  return false;
}

function buildPromptHTML(){
  return '<span class="prompt">user@quest<span class="prompt-path">:~/quest</span><span class="prompt-sign">$</span></span>';
}

function setStatus(type, text){
  els.status.className = 'status' + (type ? ' ' + type : '');
  els.statusIcon.textContent = type === 'ok' ? '✓' : type === 'err' ? '✗' : '›';
  els.statusText.textContent = text;
}

function getSuccessConfig(lesson){
  const s = lesson.success;
  if (!s) return {};
  return typeof s === 'string' ? { message: s } : s;
}

/* ================== ТЕРМИНАЛ ================== */
function submitTerminal(){
  const lesson = curLesson();
  const val = els.termInput.value.trim();
  if (!val) return;

  const echo = document.createElement('div');
  echo.className = 'term-row';
  echo.innerHTML = buildPromptHTML() + '<span class="cmd">' + escapeHtml(val) + '</span>';
  els.termLog.appendChild(echo);
  els.termInput.value = '';

  if (checkAnswer(lesson, val)){
    renderOutput(lesson.output);
    markDone(lesson);
    updateHud(); renderSidebar();

    els.termPanel.classList.add('success');
    els.termInput.disabled = true;
    showBadge('terminal');
    setStatus('ok', 'Правильно!');
    saveProgress();
    setTimeout(() => showSuccess(lesson), 500);
  } else {
    const err = document.createElement('div');
    err.className = 'term-err';
    err.textContent = '✗ Команда не распознана. Попробуй ещё раз.';
    els.termLog.appendChild(err);
    if (lesson.hint){
      els.hintLine.innerHTML = '💡 ' + lesson.hint;
      els.hintLine.classList.add('show');
    }
    setStatus('err', 'Не то. Посмотри подсказку.');
    els.termInput.focus();
  }
  els.termBody.scrollTop = els.termBody.scrollHeight;
}

/* ================== КОД ================== */
function runCode(){
  const lesson = curLesson();
  const code = els.codeArea.value;

  els.codeOut.textContent = '';
  let output = '';

  if (lesson.run && (lesson.lang === 'js' || !lesson.lang)){
    const logs = [];
    const origLog = console.log;
    try {
      console.log = (...args) => logs.push(args.map(a => {
        try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
        catch(e){ return String(a); }
      }).join(' '));
      new Function(code)();
      console.log = origLog;
    } catch(e){
      console.log = origLog;
      logs.push('Error: ' + e.message);
    }
    output = logs.join('\n');
  } else {
    output = Array.isArray(lesson.output) ? lesson.output.join('\n') : (lesson.output || '(нет вывода)');
  }

  els.codeOut.textContent = output || '(пусто)';

  if (checkAnswer(lesson, code)){
    markDone(lesson);
    updateHud(); renderSidebar();
    showBadge('code');
    setStatus('ok', 'Код принят!');
    saveProgress();
    setTimeout(() => showSuccess(lesson), 500);
  } else {
    if (lesson.hint){
      els.hintLine.innerHTML = '💡 ' + lesson.hint;
      els.hintLine.classList.add('show');
    }
    setStatus('err', 'Код ещё не тот. Посмотри подсказку.');
  }
}

/* ================== ВИКТОРИНА ================== */
function selectQuizOption(optIdx){
  if (quizLocked) return;
  const lesson = curLesson();
  if (lesson.type !== 'quiz') return;

  const buttons = els.quizOptions.querySelectorAll('.quiz-option');
  const isCorrect = optIdx === lesson.correct;

  if (isCorrect){
    quizLocked = true;
    buttons.forEach((b, i) => {
      b.disabled = true;
      if (i === lesson.correct) b.classList.add('correct');
    });
    markDone(lesson);
    updateHud(); renderSidebar();
    showBadge('quiz');
    setStatus('ok', 'Правильно!');
    saveProgress();
    setTimeout(() => showSuccess(lesson), 500);
  } else {
    buttons.forEach((b, i) => {
      b.disabled = true;
      if (i === lesson.correct) b.classList.add('correct');
      else if (i === optIdx)   b.classList.add('wrong');
    });
    if (lesson.hint){
      els.hintLine.innerHTML = '💡 ' + lesson.hint;
      els.hintLine.classList.add('show');
    }
    setStatus('err', 'Неверно. Попробуй ещё раз.');
    setTimeout(() => {
      buttons.forEach(b => { b.disabled = false; b.classList.remove('correct','wrong'); });
    }, 1000);
  }
}

/* ================== УСПЕХ ================== */
function showSuccess(lesson){
  const cfg = getSuccessConfig(lesson);
  const isLast = state.lessonIdx >= curCourse().lessons.length - 1;

  els.sIcon.textContent = cfg.icon || '✓';
  els.sTitle.textContent = cfg.title || 'Правильно!';
  els.sMessage.textContent = cfg.message || 'Отличная работа, двигаемся дальше.';
  els.sContinue.textContent = cfg.continueText || (isLast ? 'Завершить ✓' : 'Дальше →');
  els.sRetry.textContent = cfg.retryText || '↻ Повторить';

  els.successBlock.classList.add('show');
  setTimeout(() => {
    els.successBlock.scrollIntoView({behavior:'smooth', block:'center'});
  }, 80);
}
function hideSuccess(){ els.successBlock.classList.remove('show'); }

function continueFromSuccess(){
  hideSuccess();
  const isLast = state.lessonIdx >= curCourse().lessons.length - 1;
  if (!isLast){
    loadLesson(state.lessonIdx + 1);
  } else {
    els.finalTitle.textContent = 'Курс пройден!';
    els.finalText.innerHTML = '«' + escapeHtml(curCourse().title) + '» завершён.<br>Открой меню и выбери следующий.';
    els.overlay.classList.add('show');
  }
}
function retryFromSuccess(){ hideSuccess(); loadLesson(state.lessonIdx); }

/* ================== КНОПКА ОЧИСТКИ ================== */
let clearArmed = false;
let clearTimer = null;

function disarmClear(){
  clearArmed = false;
  clearTimeout(clearTimer);
  els.sbClear.classList.remove('armed');
  els.sbClear.textContent = '🗑 Очистить все данные';
}

els.sbClear.addEventListener('click', () => {
  if (!clearArmed){
    clearArmed = true;
    els.sbClear.classList.add('armed');
    els.sbClear.textContent = '⚠ Нажмите ещё раз для удаления';
    clearTimer = setTimeout(disarmClear, 4000);
    return;
  }

  disarmClear();
  clearProgress();

  state = {
    courseId: APP.courses[0].id,
    lessonIdx: 0,
    progress: {}
  };
  openCourseId = state.courseId;

  els.overlay.classList.remove('show');
  hideSuccess();
  loadLesson(0);
  renderSidebar();
});

/* ================== СОБЫТИЯ ================== */
els.menuBtn.addEventListener('click', openSidebar);
els.sbClose.addEventListener('click', closeSidebar);
els.backdrop.addEventListener('click', closeSidebar);

els.termInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); submitTerminal(); }
});
els.termInput.addEventListener('focus', () => setTimeout(() => scrollFieldIntoView(els.termInput), 300));
els.codeArea.addEventListener('focus', () => setTimeout(() => scrollFieldIntoView(els.codeArea), 300));

window.addEventListener('resize', () => {
  const a = document.activeElement;
  if (a === els.termInput || a === els.codeArea){
    setTimeout(() => scrollFieldIntoView(a), 50);
  }
});

els.runBtn.addEventListener('click', runCode);

els.prevBtn.addEventListener('click', () => {
  if (state.lessonIdx > 0) loadLesson(state.lessonIdx - 1);
});
els.resetBtn.addEventListener('click', () => loadLesson(state.lessonIdx));
els.nextBtn.addEventListener('click', () => {
  const isLast = state.lessonIdx >= curCourse().lessons.length - 1;
  if (!isLast) loadLesson(state.lessonIdx + 1);
  else els.overlay.classList.add('show');
});

window.addEventListener('keydown', e => {
  if (e.key === 'Enter' && els.termInput.disabled && !els.nextBtn.disabled){
    els.nextBtn.click();
  }
});

els.sContinue.addEventListener('click', continueFromSuccess);
els.sRetry.addEventListener('click', retryFromSuccess);

els.restartBtn.addEventListener('click', () => {
  clearProgress();
  state = { courseId: APP.courses[0].id, lessonIdx: 0, progress: {} };
  openCourseId = state.courseId;
  els.overlay.classList.remove('show');
  loadLesson(0);
});

/* ================== СТАРТ ================== */
(function init(){
  const saved = loadProgress();

  if (saved && typeof saved === 'object'){
    if (typeof saved.courseId === 'string') state.courseId = saved.courseId;
    state.progress = normalizeProgress(saved.progress);
  }

  if (!APP.courses.find(c => c.id === state.courseId)){
    state.courseId = APP.courses[0].id;
  }

  // Определяем стартовый индекс по сохранённому ID текущего урока
  const cp = state.progress[state.courseId];
  let startIdx = 0;
  if (cp && cp.current){
    const found = curCourse().lessons.findIndex(l => lid(state.courseId, l) === cp.current);
    if (found >= 0) startIdx = found;
  }

  openCourseId = state.courseId;
  loadLesson(startIdx);
})();
</script>
