<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Админка · Квесты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080c;--panel:#0a0e14;--panel-head:#0d1219;
  --line:#1a2029;--line-2:#242c38;
  --text:#c9d1d9;--dim:#6e7681;
  --green:#7ee787;--green-2:#3fb950;
  --amber:#fbbf24;--red:#ff7b72;--blue:#58a6ff;
  --sb:260px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--text);
  font:14px/1.55 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(88,166,255,.08),transparent),
    radial-gradient(ellipse 60% 50% at 50% 120%,rgba(126,231,135,.05),transparent);
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font:inherit}

.app{display:flex;flex-direction:column;width:100%;max-width:960px;margin:0 auto;padding:0 16px;min-height:100vh;min-height:100dvh}
.hud{
  display:flex;align-items:center;gap:8px;
  padding:10px 4px;border-bottom:1px solid var(--line);
  flex-shrink:0;position:sticky;top:0;z-index:5;
  background:linear-gradient(to bottom,var(--bg) 75%,transparent);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.menu-btn{
  width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:6px;
  background:var(--panel);border:1px solid var(--line-2);color:var(--text);font-size:16px;transition:all .15s;
}
.menu-btn:hover{border-color:var(--green-2);color:var(--green)}
.hud-title{font-size:11.5px;font-weight:700;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}

.btn{
  padding:8px 14px;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;
  color:var(--text);font-size:13px;transition:all .15s;
}
.btn:hover:not(:disabled){border-color:var(--green-2);color:var(--green)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.primary{background:rgba(126,231,135,.1);border-color:var(--green-2);color:var(--green)}
.btn.primary:hover{background:rgba(126,231,135,.18)}
.btn.danger{background:rgba(255,123,114,.06);border-color:rgba(255,123,114,.3);color:var(--red)}
.btn.danger:hover{background:rgba(255,123,114,.16);border-color:var(--red)}
.btn.icon{padding:6px 9px;min-width:30px}

.main{flex:1;padding:14px 0 40px;display:flex;flex-direction:column;gap:12px}

.status{
  display:flex;align-items:center;gap:8px;margin-top:10px;
  padding:7px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;font-size:11.5px;min-height:34px;
}
.status-icon{color:var(--green);font-weight:700}
.status-text{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.dirty{border-color:rgba(251,191,36,.4)}
.status.dirty .status-icon,.status.dirty .status-text{color:var(--amber)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.panel-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel-head);border-bottom:1px solid var(--line);min-height:36px}
.panel-dots{display:flex;gap:5px;flex-shrink:0}
.panel-dots i{width:10px;height:10px;border-radius:50%;display:block}
.panel-dots i:nth-child(1){background:#ff5f57}
.panel-dots i:nth-child(2){background:#febc2e}
.panel-dots i:nth-child(3){background:#28c840}
.panel-title{font-size:11px;color:var(--dim);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-tag{
  margin-left:auto;font-size:10px;padding:2px 8px;border-radius:4px;
  background:rgba(88,166,255,.1);color:var(--blue);
  border:1px solid rgba(88,166,255,.25);flex-shrink:0;white-space:nowrap;
  max-width:45%;overflow:hidden;text-overflow:ellipsis;
}
.panel-body{padding:12px 14px}

/* -------- поля -------- */
.fld{
  display:grid;grid-template-columns:112px 1fr 30px;grid-template-areas:"l i b";
  gap:7px;align-items:start;margin-bottom:7px;
}
.fld>label{
  grid-area:l;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);padding-top:9px;overflow:hidden;text-overflow:ellipsis;
}
.fld>.inp{grid-area:i}
.fld>.sv{grid-area:b}
.inp{
  width:100%;background:#05070a;border:1px solid var(--line-2);border-radius:5px;
  padding:7px 9px;color:var(--text);font:12.5px/1.45 'JetBrains Mono',monospace;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.inp:focus{border-color:var(--green-2);box-shadow:0 0 0 2px rgba(126,231,135,.1)}
.inp::placeholder{color:#3a424e}
textarea.inp{resize:vertical;min-height:54px}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
.sv{
  width:30px;height:30px;border-radius:5px;border:1px solid var(--line-2);
  background:var(--panel-head);color:var(--dim);font-size:13px;
  transition:all .15s;display:grid;place-items:center;
}
.sv:hover{border-color:var(--green-2);color:var(--green);background:rgba(126,231,135,.08)}
.sv.ok{background:rgba(126,231,135,.18);border-color:var(--green-2);color:var(--green);transform:scale(1.06)}
.sv.del:hover{border-color:var(--red);color:var(--red);background:rgba(255,123,114,.1)}

.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.divider{height:1px;background:var(--line);margin:12px 0}
.sec-title{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}

/* -------- quiz options -------- */
.opt-row{display:grid;grid-template-columns:28px 1fr 30px 30px;gap:6px;margin-bottom:6px;align-items:center}
.pick{
  width:28px;height:30px;border-radius:5px;border:1px solid var(--line-2);
  background:var(--panel-head);color:var(--dim);font-size:12px;display:grid;place-items:center;transition:all .15s;
}
.pick:hover{border-color:var(--green-2);color:var(--green)}
.pick.on{background:rgba(126,231,135,.18);border-color:var(--green-2);color:var(--green)}

.empty{padding:34px 18px;text-align:center;color:var(--dim);font-size:13px;background:var(--panel);border:1px dashed var(--line-2);border-radius:8px}

/* -------- sidebar -------- */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sb);max-width:88vw;
  background:var(--panel);border-right:1px solid var(--line-2);
  z-index:60;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .25s ease;
  box-shadow:8px 0 40px rgba(0,0,0,.5);
}
.sidebar.open{transform:translateX(0)}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sb-head b{font-size:12px;letter-spacing:.14em;color:var(--green);flex:1}
.sb-close{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--dim);font-size:16px}
.sb-close:hover{color:var(--red)}
.sb-list{flex:1;overflow-y:auto;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.sb-list::-webkit-scrollbar{width:5px}
.sb-list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.sb-course-title{
  display:flex;align-items:center;gap:10px;padding:9px 14px;width:100%;text-align:left;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);transition:background .15s;
}
.sb-course-title:hover{background:rgba(255,255,255,.02);color:var(--text)}
.sb-course.active .sb-course-title{color:var(--text)}
.sb-course-title .ic{
  width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-size:10px;
  background:rgba(88,166,255,.1);color:var(--blue);border:1px solid rgba(88,166,255,.2);flex-shrink:0;font-weight:700;
}
.sb-course.active .sb-course-title .ic{background:rgba(126,231,135,.15);color:var(--green);border-color:rgba(126,231,135,.3)}
.sb-course-title .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-course-title .cnt{font-size:10px;color:var(--dim);padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.04);flex-shrink:0}
.sb-lesson{
  display:flex;align-items:center;gap:8px;padding:7px 14px 7px 30px;font-size:12px;color:var(--dim);
  width:100%;text-align:left;border-left:2px solid transparent;transition:all .12s;
}
.sb-lesson:hover{color:var(--text);background:rgba(255,255,255,.02)}
.sb-lesson.active{color:var(--green);border-left-color:var(--green);background:rgba(126,231,135,.05)}
.sb-lesson .num{color:var(--dim);font-size:10px;flex-shrink:0}
.sb-lesson .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-foot{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel-head)}
.sb-link{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--text);
  text-decoration:none;transition:background .15s;border:1px solid transparent;
}
.sb-link:hover{background:rgba(88,166,255,.06);border-color:rgba(88,166,255,.15)}
.sb-link .ic{width:26px;height:26px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;font-size:12px;background:rgba(88,166,255,.1);color:var(--blue);border:1px solid rgba(88,166,255,.2)}
.sb-link .tx{display:flex;flex-direction:column;min-width:0}
.sb-link .tx b{font-size:12px;font-weight:600}
.sb-link .tx i{font-style:normal;font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);
  background:var(--panel);border:1px solid var(--green-2);color:var(--green);
  padding:9px 16px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:.25s;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--red);color:var(--red)}

/* ============ LOGIN OVERLAY ============ */
.login-overlay{
  position:fixed;inset:0;background:rgba(6,8,12,.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:none;place-items:center;z-index:200;padding:20px;
}
.login-overlay.show{display:grid}
.login-card{
  background:var(--panel);border:1px solid var(--line-2);
  border-radius:12px;padding:26px 28px;max-width:360px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:loginIn .3s ease-out;
}
@keyframes loginIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.login-card .panel-dots{margin-bottom:14px}
.login-card h2{font-size:15px;color:var(--green);margin-bottom:4px;font-weight:700}
.login-sub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.login-card label{
  display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);margin:10px 0 4px;
}
.login-card .inp{padding:9px 11px;font-size:13px}
.login-error{
  min-height:18px;font-size:11.5px;color:var(--red);
  margin:10px 0 2px;
}
.login-card .btn{width:100%;padding:11px;margin-top:2px;font-size:13px}

@media (max-width:560px){
  .app{padding:0 10px}
  .hud-title{font-size:10.5px;letter-spacing:.06em}
  .fld{grid-template-columns:1fr 30px;grid-template-areas:"l l" "i b"}
  .fld>label{padding-top:0;padding-bottom:2px}
  .panel-body{padding:10px 11px}
  .btn{padding:7px 11px;font-size:12px}
  .btn.sm{padding:5px 8px;font-size:11.5px}
}
</style>
</head>
<body>

<div class="app">

  <header class="hud">
    <button class="menu-btn" id="menuBtn" aria-label="Курсы">≡</button>
    <span class="hud-title">АДМИНКА · КВЕСТЫ</span>
    <div class="hud-right">
      <button class="btn sm" id="openBtn" title="Открыть quests.json">📂</button>
      <button class="btn sm" id="dlBtn" title="Скачать quests.json">💾</button>
      <button class="btn sm primary" id="addCourseBtn" title="Добавить курс">＋</button>
      <button class="btn sm danger" id="logoutBtn" title="Выйти" style="display:none">⎋</button>
    </div>
  </header>

  <div class="status" id="status">
    <span class="status-icon" id="statusIcon">›</span>
    <span class="status-text" id="statusText">Загрузка…</span>
  </div>

  <main class="main" id="main"></main>

</div>

<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <b>КУРСЫ</b>
    <button class="sb-close" id="sbClose">✕</button>
  </div>
  <div class="sb-list" id="sbList"></div>
  <div class="sb-foot">
    <a class="sb-link" href="index.html" target="_blank" rel="noopener">
      <span class="ic">👁</span>
      <span class="tx"><b>Открыть страницу квестов</b><i>Предпросмотр результата</i></span>
    </a>
  </div>
</aside>
<div class="backdrop" id="backdrop"></div>
<div class="toast" id="toast"></div>
<!-- ============ ОКНО ВХОДА ============ -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="panel-dots"><i></i><i></i><i></i></div>
    <h2>🔒 Вход в админку</h2>
    <p class="login-sub">Логин и пароль — из файла <code>auth.txt</code></p>
    <form id="loginForm" autocomplete="off">
      <label>Логин</label>
      <input class="inp" id="loginUser" type="text" autocomplete="username" required>
      <label>Пароль</label>
      <input class="inp" id="loginPass" type="password" autocomplete="current-password" required>
      <div class="login-error" id="loginError"></div>
      <button class="btn primary" type="submit" id="loginBtn">Войти →</button>
    </form>
  </div>
</div>
<script>
/* ================================================================
   АДМИНКА — редактирование quests.json
   ================================================================ */
const $ = id => document.getElementById(id);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => (String(s||'').toLowerCase().match(/[\p{L}\p{N}]+/gu)||['x']).join('-');

const DEF_LABELS = {info:'Информация',task:'Задание',term:'Терминал',quiz:'Викторина',code:'Код',success:'Результат',badge:'✓ Принято'};

let DATA = { title:'КВЕСТ', defaultLabels:{...DEF_LABELS}, courses: [] };
let cur = { c: 0, l: 0 };
let fileHandle = null;
let dirty = false;
let saveTimer = null;
/* ============ АВТОРИЗАЦИЯ ============ */
const AUTH_FILE = 'auth.txt';
const AUTH_KEY  = 'quest-admin-auth';
const AUTH_TTL  = 12 * 60 * 60 * 1000; // 12 часов

/* Читает auth.txt → массив строк без комментариев */
async function loadAuthLines(){
  let r;
  try{
    r = await fetch(AUTH_FILE, {cache:'no-store'});
  }catch(e){
    throw new Error('auth.txt недоступен. Открой через http(s), а не file://');
  }
  if (!r.ok) throw new Error('auth.txt не найден (' + r.status + ')');
  const text = await r.text();
  return text.split('\n')
             .map(s => s.trim())
             .filter(s => s && !s.startsWith('#'));
}

/* Проверяет пару логин/пароль */
async function verifyCredentials(user, pass){
  const lines = await loadAuthLines();
  for (const line of lines){
    const idx = line.indexOf(':');
    if (idx < 0) continue;
    if (line.slice(0, idx) === user && line.slice(idx + 1) === pass) return true;
  }
  return false;
}

/* Сессия в localStorage с истечением AUTH_TTL */
function isAuthorized(){
  try{
    const raw = localStorage.getItem(AUTH_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !d.ok || !d.exp || d.exp < Date.now()){
      localStorage.removeItem(AUTH_KEY);
      return false;
    }
    return true;
  }catch(e){ return false; }
}
function setAuthorized(){
  try{
    localStorage.setItem(AUTH_KEY, JSON.stringify({ ok:true, exp: Date.now() + AUTH_TTL }));
  }catch(e){}
}
function clearAuth(){
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
}

function showLogin(){
  $('loginOverlay').classList.add('show');
  $('loginError').textContent = '';
  $('loginUser').value = '';
  $('loginPass').value = '';
  setTimeout(()=>$('loginUser').focus(), 60);
}
function hideLogin(){
  $('loginOverlay').classList.remove('show');
}

/* Кнопка «Выйти» */
function logout(){
  clearAuth();
  location.reload();
}
/* ---------------- утилиты ---------------- */
function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = 'toast' + (isErr?' err':''); }, 2200);
}
function flash(btn){
  btn.classList.add('ok');
  setTimeout(()=>btn.classList.remove('ok'), 650);
}
function uniqueId(base, used){
  let id = base, i = 1;
  while (used.includes(id)) id = base + '-' + (++i);
  return id;
}

/* ---------------- нормализация ---------------- */
function normalize(d){
  d = (d && typeof d === 'object') ? d : {};
  d.title = d.title || 'КВЕСТ';
  d.defaultLabels = Object.assign({}, DEF_LABELS, d.defaultLabels || {});
  d.courses = Array.isArray(d.courses) ? d.courses : [];
  d.courses.forEach((c, ci) => {
    c.id = c.id || slug(c.title || ('course-' + (ci+1)));
    c.lessons = Array.isArray(c.lessons) ? c.lessons : [];
    c.lessons.forEach((l, li) => {
      l.id = l.id || (c.id + '-' + slug(l.title || ('lesson-' + (li+1))));
      l.type = l.type || 'quiz';
      if (typeof l.success === 'string') l.success = { message: l.success };
      if (!l.success || typeof l.success !== 'object') l.success = {};
      if (l.type === 'quiz' && !Array.isArray(l.options)) l.options = [];
      if (l.type === 'quiz' && typeof l.correct !== 'number') l.correct = 0;
    });
  });
  return d;
}

/* ---------------- сохранение ---------------- */
function persist(){
  localStorage.setItem('quests-data', JSON.stringify(DATA));
  dirty = true;
  paintStatus();
  if (fileHandle){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 350);
  }
}
async function writeFile(){
  if (!fileHandle) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(DATA, null, 2));
    await w.close();
    dirty = false;
    paintStatus();
    toast('💾 Записано в quests.json');
  }catch(e){
    toast('✗ Ошибка записи: ' + e.message, true);
  }
}
function paintStatus(){
  const s = $('status'), i = $('statusIcon'), t = $('statusText');
  if (fileHandle){
    s.className = 'status' + (dirty ? ' dirty' : '');
    i.textContent = dirty ? '●' : '✓';
    t.textContent = (dirty ? 'Есть несохранённые правки · ' : 'Файл: ') + (fileHandle.name || 'quests.json');
  } else {
    s.className = 'status' + (dirty ? ' dirty' : '');
    i.textContent = dirty ? '●' : '›';
    t.textContent = dirty
      ? 'Черновик в localStorage · нажми 💾 чтобы скачать quests.json'
      : 'Нажми 📂 чтобы открыть quests.json (или ＋ и создай первый курс)';
  }
}

/* ---------------- файл ---------------- */
async function openFile(){
  if (!window.showOpenFilePicker){
    toast('Браузер не поддерживает. Используй «💾» — скачать JSON.', true);
    return;
  }
  try{
    const [h] = await showOpenFilePicker({
      types:[{description:'JSON', accept:{'application/json':['.json']}}],
      multiple:false
    });
    fileHandle = h;
    const f = await h.getFile();
    DATA = normalize(JSON.parse(await f.text()));
    cur = { c:0, l:0 };
    dirty = false;
    render();
    toast('📂 ' + f.name + ' загружен');
  }catch(e){
    if (e.name !== 'AbortError') toast('✗ ' + e.message, true);
  }
}
async function saveAs(){
  if (window.showSaveFilePicker){
    try{
      fileHandle = await showSaveFilePicker({
        suggestedName: 'quests.json',
        types:[{description:'JSON', accept:{'application/json':['.json']}}]
      });
      await writeFile();
      return;
    }catch(e){
      if (e.name === 'AbortError') return;
    }
  }
  downloadJson();
}
function downloadJson(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'quests.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  dirty = false; paintStatus();
  toast('💾 quests.json скачан — положи рядом с quests.html');
}

/* ---------------- seed ---------------- */
function seed(){
  return {
    title:'КВЕСТ',
    defaultLabels:{...DEF_LABELS},
    courses:[{
      id:'new-course', title:'Новый курс', icon:'★',
      lessons:[{
        id:'new-course-1', type:'quiz', title:'Новый урок',
        info:'<p>Описание урока.</p>',
        task:'Выбери правильный ответ.',
        question:'Вопрос?',
        options:['Вариант 1','Вариант 2'],
        correct:0, hint:'',
        success:{icon:'✓',title:'Верно!',message:'Молодец.',continueText:'Дальше →'}
      }]
    }]
  };
}

/* ---------------- UI-хелперы ---------------- */
function panel(title, tag){
  const p = el('section','panel');
  const h = el('div','panel-head');
  h.innerHTML = '<span class="panel-dots"><i></i><i></i><i></i></span>';
  const t = el('span','panel-title'); t.textContent = title; h.appendChild(t);
  if (tag){ const g = el('span','panel-tag'); g.textContent = tag; h.appendChild(g); }
  const b = el('div','panel-body');
  p.append(h,b);
  return {root:p, body:b, head:h};
}

function fld(body, label, value, onSave, opt = {}){
  const row = el('div','fld');
  const lab = el('label'); lab.textContent = label;
  const inp = opt.ta ? el('textarea','inp') : el('input','inp');
  inp.value = value == null ? '' : value;
  if (opt.ta) inp.rows = opt.rows || 3;
  if (opt.ph) inp.placeholder = opt.ph;
  if (opt.mono) inp.style.letterSpacing = '.02em';
  const btn = el('button','sv'); btn.type='button'; btn.textContent='✓'; btn.title='Сохранить поле';
  const commit = () => { onSave(inp.value); flash(btn); };
  btn.onclick = commit;
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (opt.ta ? (e.ctrlKey || e.metaKey) : !e.shiftKey)){
      e.preventDefault(); commit();
    }
  });
  row.append(lab, inp, btn);
  body.appendChild(row);
  return {row, inp};
}

function sel(body, label, value, options, onSave){
  const row = el('div','fld');
  const lab = el('label'); lab.textContent = label;
  const s = el('select','inp');
  options.forEach(o => {
    const v = typeof o === 'object' ? o.v : o;
    const t = typeof o === 'object' ? o.t : o;
    const op = el('option'); op.value = v; op.textContent = t;
    if (String(v) === String(value)) op.selected = true;
    s.appendChild(op);
  });
  const btn = el('button','sv'); btn.type='button'; btn.textContent='✓'; btn.title='Сохранить поле';
  btn.onclick = () => { onSave(s.value); flash(btn); };
  row.append(lab, s, btn);
  body.appendChild(row);
  return s;
}

function btn(text, cls, onClick){
  const b = el('button','btn' + (cls ? ' ' + cls : ''));
  b.type = 'button'; b.textContent = text; b.onclick = onClick;
  return b;
}

/* ---------------- render ---------------- */
function render(keepScroll){
  const y = keepScroll ? window.scrollY : 0;
  renderSidebar();
  renderEditor();
  paintStatus();
  if (keepScroll) window.scrollTo(0, y);
}

function renderSidebar(){
  const list = $('sbList');
  list.innerHTML = '';
  if (!DATA.courses.length){
    list.appendChild(el('div','empty','Курсов нет'));
    return;
  }
  DATA.courses.forEach((c, ci) => {
    const wrap = el('div','sb-course' + (ci === cur.c ? ' active' : ''));
    const head = el('button','sb-course-title');
    head.type = 'button';
    head.innerHTML = '<span class="ic">' + esc(c.icon || '•') + '</span>' +
                     '<span class="ttl">' + esc(c.title || 'Без названия') + '</span>' +
                     '<span class="cnt">' + c.lessons.length + '</span>';
    head.onclick = () => { cur = { c: ci, l: 0 }; render(); closeSidebar(); };
    wrap.appendChild(head);
    c.lessons.forEach((l, li) => {
      const b = el('button','sb-lesson' + (ci === cur.c && li === cur.l ? ' active' : ''));
      b.type = 'button';
      b.innerHTML = '<span class="num">' + (li+1) + '.</span><span class="txt">' + esc(l.title || 'Без названия') + '</span>';
      b.onclick = () => { cur = { c: ci, l: li }; render(); closeSidebar(); };
      wrap.appendChild(b);
    });
    list.appendChild(wrap);
  });
}

function renderEditor(){
  const M = $('main');
  M.innerHTML = '';

  const c = DATA.courses[cur.c];
  if (!c){
    M.appendChild(el('div','empty','Нет курсов — нажми «＋» в шапке.'));
    return;
  }

  /* ---- панель курса ---- */
  const cp = panel('Курс', c.id || '');
  fld(cp.body, 'ID курса', c.id, v => {
    v = (v || '').trim() || slug(c.title);
    if (DATA.courses.some(x => x !== c && x.id === v)) { toast('✗ Такой ID курса уже занят', true); render(); return; }
    c.id = v; persist(); render(true);
  }, {ph:'terminal'});
  fld(cp.body, 'Название', c.title, v => {
    c.title = v;
    cp.root.querySelector('.panel-title').textContent = 'Курс';
    persist(); renderSidebar();
  });
  fld(cp.body, 'Иконка', c.icon, v => { c.icon = v; persist(); renderSidebar(); }, {ph:'>_'});

  const acts = el('div','row-actions');
  acts.append(
    btn('＋ Урок', 'primary', () => addLesson(c)),
    btn('⧉ Дублировать', '', () => dupCourse()),
    btn('🗑 Удалить курс', 'danger', () => delCourse())
  );
  cp.body.appendChild(acts);

  const det = el('details');
  const sum = el('summary','sec-title');
  sum.textContent = 'Заголовки блоков курса (необязательно)';
  sum.style.cursor = 'pointer';
  det.appendChild(sum);
  c.labels = c.labels || {};
  ['info','task','term','quiz','code','success','badge'].forEach(k => {
    fld(det, k, c.labels[k] || '', v => {
      if (v.trim()) c.labels[k] = v.trim(); else delete c.labels[k];
      persist();
    }, {ph:DEF_LABELS[k]});
  });
  cp.body.appendChild(det);
  M.appendChild(cp.root);

  /* ---- панель урока ---- */
  const l = c.lessons[cur.l];
  if (!l){
    const e = el('div','empty','В этом курсе пока нет уроков — нажми «＋ Урок».');
    M.appendChild(e);
    return;
  }
  renderLesson(M, c, l);
}

function renderLesson(M, c, l){
  /* --- шапка урока / тип / порядок --- */
  const nav = panel('Урок ' + (cur.l + 1) + ' из ' + c.lessons.length, l.type);
  sel(nav.body, 'Тип урока', l.type, [
    {v:'terminal', t:'terminal — ввод команды'},
    {v:'code',     t:'code — редактор кода'},
    {v:'quiz',     t:'quiz — викторина'}
  ], v => { l.type = v; persist(); render(true); });

  const acts = el('div','row-actions');
  acts.append(
    btn('↑', 'icon', () => moveLesson(c, cur.l, -1)),
    btn('↓', 'icon', () => moveLesson(c, cur.l, 1)),
    btn('⧉', 'icon', () => dupLesson(c, cur.l)),
    btn('✕ Удалить урок', 'danger sm', () => delLesson(c, cur.l))
  );
  nav.body.appendChild(acts);
  M.appendChild(nav.root);

  /* --- ID + контент --- */
  const p1 = panel('Информация', 'ID: ' + (l.id || '—'));
  fld(p1.body, 'ID урока', l.id, v => {
    v = (v || '').trim() || (c.id + '-' + slug(l.title));
    const used = c.lessons.filter(x => x !== l).map(x => x.id);
    if (used.includes(v)) { toast('✗ Такой ID урока уже занят', true); render(true); return; }
    l.id = v; persist(); render(true);
  }, {ph:c.id + '-lesson-1'});
  fld(p1.body, 'Заголовок', l.title, v => { l.title = v; persist(); renderSidebar(); });
  fld(p1.body, 'info (HTML)', l.info, v => { l.info = v; persist(); }, {ta:true, rows:5});
  M.appendChild(p1.root);

  const p2 = panel('Задание');
  fld(p2.body, 'task (HTML)', l.task, v => { l.task = v; persist(); }, {ta:true, rows:3});
  fld(p2.body, 'Подсказка', l.hint, v => { l.hint = v; persist(); }, {ph:'Показывается при ошибке'});
  M.appendChild(p2.root);

  /* --- специфичная панель --- */
  if (l.type === 'quiz')      M.appendChild(buildQuiz(c, l));
  else if (l.type === 'code') M.appendChild(buildCode(c, l));
  else                        M.appendChild(buildTerminal(c, l));

  /* --- результат --- */
  M.appendChild(buildSuccess(c, l));
}

/* ---- expect ---- */
function getExpect(l){
  const e = l.expect || {};
  if (Array.isArray(e.oneOf)) return { type:'oneOf', value: e.oneOf.join(', ') };
  for (const k of ['exact','startsWith','regex']) if (e[k] != null) return { type:k, value:String(e[k]) };
  return { type:'exact', value:'' };
}
function setExpect(l, type, value){
  const e = {};
  if (type === 'oneOf') e.oneOf = value.split(',').map(s => s.trim()).filter(Boolean);
  else e[type] = value;
  l.expect = e;
}

function expectBlock(body, l){
  const ex = getExpect(l);
  sel(body, 'Тип проверки', ex.type, [
    {v:'exact', t:'exact — точное совпадение'},
    {v:'startsWith', t:'startsWith — начинается с'},
    {v:'oneOf', t:'oneOf — один из (через запятую)'},
    {v:'regex', t:'regex — регулярное выражение'}
  ], v => { setExpect(l, v, getExpect(l).value); persist(); render(true); });
  fld(body, 'Значение', ex.value, v => {
    setExpect(l, getExpect(l).type, v);
    persist();
  }, {ph: ex.type === 'regex' ? '^ls -la$' : 'ls -la'});
}

function outValue(l){
  return Array.isArray(l.output) ? l.output.join('\n') : (l.output || '');
}
function setOut(l, v){
  l.output = v.includes('\n') ? v.split('\n') : v;
}

function buildTerminal(c, l){
  const p = panel('Терминал', l.cmd || '');
  fld(p.body, 'Команда (тег)', l.cmd, v => { l.cmd = v; persist(); });
  expectBlock(p.body, l);
  fld(p.body, 'Вывод', outValue(l), v => { setOut(l, v); persist(); }, {ta:true, rows:4, ph:'Одна строка = одна строка вывода'});
  return p.root;
}

function buildCode(c, l){
  const p = panel('Код', l.lang || 'js');
  sel(p.body, 'Язык', l.lang || 'js', ['js','py','txt'], v => { l.lang = v; persist(); });
  sel(p.body, 'Запускать JS', l.run ? '1' : '0', [{v:'0',t:'нет'},{v:'1',t:'да'}], v => { l.run = v === '1'; persist(); });
  fld(p.body, 'Стартовый код', l.starter, v => { l.starter = v; persist(); }, {ta:true, rows:4});
  expectBlock(p.body, l);
  fld(p.body, 'Вывод (без запуска)', outValue(l), v => { setOut(l, v); persist(); }, {ta:true, rows:3});
  return p.root;
}

function buildQuiz(c, l){
  const p = panel('Викторина');
  fld(p.body, 'Вопрос (HTML)', l.question, v => { l.question = v; persist(); }, {ta:true, rows:2});
  p.body.appendChild(el('div','sec-title','Варианты ответа · ● = правильный'));
  const opts = l.options || (l.options = []);
  opts.forEach((o, i) => {
    const row = el('div','opt-row');
    const pick = el('button','pick' + (l.correct === i ? ' on' : ''));
    pick.type = 'button';
    pick.textContent = l.correct === i ? '●' : '○';
    pick.title = 'Отметить как правильный';
    pick.onclick = () => { l.correct = i; persist(); render(true); };

    const inp = el('input','inp');
    inp.value = o;
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); sv.click(); }
    });
    const sv = el('button','sv'); sv.type='button'; sv.textContent='✓'; sv.title='Сохранить вариант';
    sv.onclick = () => { opts[i] = inp.value; persist(); flash(sv); };

    const del = el('button','sv del'); del.type='button'; del.textContent='✕'; del.title='Удалить вариант';
    del.onclick = () => {
      opts.splice(i, 1);
      if (l.correct >= opts.length) l.correct = Math.max(0, opts.length - 1);
      persist(); render(true);
    };
    row.append(pick, inp, sv, del);
    p.body.appendChild(row);
  });
  const add = el('button','btn sm'); add.type='button'; add.textContent='＋ вариант';
  add.onclick = () => { opts.push('Новый вариант'); persist(); render(true); };
  p.body.appendChild(add);
  return p.root;
}

function buildSuccess(c, l){
  const s = l.success;
  const p = panel('Результат', 'показывается после верного ответа');
  fld(p.body, 'Иконка', s.icon, v => { s.icon = v; persist(); }, {ph:'✓'});
  fld(p.body, 'Заголовок', s.title, v => { s.title = v; persist(); }, {ph:'Правильно!'});
  fld(p.body, 'Сообщение', s.message, v => { s.message = v; persist(); }, {ta:true, rows:2});
  fld(p.body, 'Кнопка «далее»', s.continueText, v => { s.continueText = v; persist(); }, {ph:'Дальше →'});
  fld(p.body, 'Кнопка «повтор»', s.retryText, v => { s.retryText = v; persist(); }, {ph:'↻ Повторить'});
  return p.root;
}

/* ---------------- CRUD ---------------- */
function addCourse(){
  const id = uniqueId('course', DATA.courses.map(c => c.id));
  DATA.courses.push({ id, title:'Новый курс', icon:'★', lessons:[] });
  cur = { c: DATA.courses.length - 1, l: 0 };
  persist(); render();
  toast('＋ Курс добавлен');
}
function delCourse(){
  const c = DATA.courses[cur.c];
  if (!c) return;
  if (!confirm('Удалить курс «' + (c.title || c.id) + '» вместе со всеми уроками?')) return;
  DATA.courses.splice(cur.c, 1);
  cur = { c: Math.max(0, Math.min(cur.c, DATA.courses.length - 1)), l: 0 };
  persist(); render();
}
function dupCourse(){
  const c = DATA.courses[cur.c];
  if (!c) return;
  const copy = JSON.parse(JSON.stringify(c));
  copy.id = uniqueId(c.id + '-copy', DATA.courses.map(x => x.id));
  copy.title = c.title + ' (копия)';
  copy.lessons.forEach(l => {
    l.id = uniqueId(l.id + '-copy', DATA.courses.flatMap(x => x.lessons.map(y => y.id)).concat(copy.lessons.map(y => y.id)));
  });
  DATA.courses.push(copy);
  cur = { c: DATA.courses.length - 1, l: 0 };
  persist(); render();
  toast('⧉ Курс скопирован');
}
function addLesson(c){
  const allIds = c.lessons.map(l => l.id);
  const id = uniqueId(c.id + '-lesson', allIds);
  c.lessons.push({
    id, type:'quiz', title:'Новый урок',
    info:'<p>Описание урока.</p>',
    task:'Выбери правильный ответ.',
    question:'Вопрос?',
    options:['Вариант 1','Вариант 2'],
    correct:0, hint:'',
    success:{ icon:'✓', title:'Верно!', message:'Молодец.', continueText:'Дальше →' }
  });
  cur.l = c.lessons.length - 1;
  persist(); render();
  toast('＋ Урок добавлен');
}
function dupLesson(c, i){
  const l = c.lessons[i];
  if (!l) return;
  const copy = JSON.parse(JSON.stringify(l));
  copy.id = uniqueId(l.id + '-copy', c.lessons.map(x => x.id));
  copy.title = l.title + ' (копия)';
  c.lessons.splice(i + 1, 0, copy);
  cur.l = i + 1;
  persist(); render();
}
function delLesson(c, i){
  const l = c.lessons[i];
  if (!l) return;
  if (!confirm('Удалить урок «' + (l.title || l.id) + '»?')) return;
  c.lessons.splice(i, 1);
  cur.l = Math.max(0, Math.min(i, c.lessons.length - 1));
  persist(); render();
}
function moveLesson(c, i, d){
  const j = i + d;
  if (j < 0 || j >= c.lessons.length) return;
  const [x] = c.lessons.splice(i, 1);
  c.lessons.splice(j, 0, x);
  cur.l = j;
  persist(); render();
}

/* ---------------- sidebar ---------------- */
function openSidebar(){ renderSidebar(); $('sidebar').classList.add('open'); $('backdrop').classList.add('show'); }
function closeSidebar(){ $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show'); }

/* ---------------- события ---------------- */
$('menuBtn').onclick = openSidebar;
$('sbClose').onclick = closeSidebar;
$('backdrop').onclick = closeSidebar;
$('addCourseBtn').onclick = addCourse;
$('openBtn').onclick = openFile;
$('dlBtn').onclick = saveAs;

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    if (fileHandle) writeFile(); else downloadJson();
  }
});

/* ---------------- старт приложения (только после входа) ---------------- */
async function startApp(){
  let loaded = false;
  try{
    const r = await fetch('quests.json', {cache:'no-store'});
    if (r.ok){ DATA = normalize(await r.json()); loaded = true; }
  }catch(e){}
  if (!loaded){
    try{
      const raw = localStorage.getItem('quests-data');
      if (raw){ DATA = normalize(JSON.parse(raw)); loaded = true; }
    }catch(e){}
  }
  if (!loaded || !DATA.courses.length){
    DATA = normalize(seed());
  }
  dirty = false;
  $('logoutBtn').style.display = '';
  render();
}

/* обработчик формы входа */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const u   = $('loginUser').value.trim();
  const p   = $('loginPass').value;
  const err = $('loginError');
  const btn = $('loginBtn');
  if (!u || !p) return;

  btn.disabled = true;
  btn.textContent = 'Проверка…';
  err.textContent = '';

  try{
    if (await verifyCredentials(u, p)){
      setAuthorized();
      hideLogin();
      await startApp();
    } else {
      err.textContent = '✗ Неверный логин или пароль';
      $('loginPass').value = '';
      $('loginPass').focus();
    }
  }catch(ex){
    err.textContent = '✗ ' + ex.message;
  }finally{
    btn.disabled = false;
    btn.textContent = 'Войти →';
  }
});

/* обработчик выхода */
$('logoutBtn').addEventListener('click', logout);

/* ---------------- точка входа ---------------- */
(async function init(){
  if (isAuthorized()){
    hideLogin();
    await startApp();
  } else {
    showLogin();
  }
})();
</script>
